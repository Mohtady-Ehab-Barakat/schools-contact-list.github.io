:root {
  --bg:       #0c0c0e;
  --surface:  #111114;
  --border:   #222228;
  --border2:  #2e2e38;
  --text:     #e4e4f0;
  --muted:    #6b6b80;
  --dim:      #3a3a4a;
  --green:    #34d399;
  --green-bg: rgba(52,211,153,.12);
  --green-bd: rgba(52,211,153,.3);
  --amber:    #fbbf24;
  --amber-bg: rgba(251,191,36,.1);
  --amber-bd: rgba(251,191,36,.3);
  --link:     #60a5fa;
  --link-hov: #bfdbfe;
}

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 13px;
  line-height: 1.6;
  min-height: 100vh;
  padding: 32px 24px 64px;
}

/* subtle grid bg */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 40px 40px;
  opacity: .35;
  pointer-events: none;
  z-index: 0;
}

#root { position: relative; z-index: 1; max-width: 1600px; margin: 0 auto; }

/* ── HEADER ── */
.header { margin-bottom: 32px; }
.header-eyebrow {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: .25em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
}
.header-title {
  font-size: 26px;
  font-weight: 600;
  color: #fff;
  letter-spacing: -.4px;
}
.header-sub { color: var(--muted); font-size: 12px; margin-top: 4px; }

.legend { display: flex; gap: 20px; margin-top: 14px; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; }
.dot { width: 7px; height: 7px; border-radius: 50%; }
.dot-green { background: var(--green); }
.dot-amber { background: var(--amber); }

/* ── SCROLL WRAPPER ── */
.scroll-wrap {
  overflow-x: auto;
  border-radius: 12px;
  border: 1px solid var(--border2);
  box-shadow: 0 0 0 1px rgba(255,255,255,.03), 0 24px 64px rgba(0,0,0,.6);
}
.scroll-wrap::-webkit-scrollbar { height: 5px; background: var(--surface); }
.scroll-wrap::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 3px; }

/* ── TABLE ── */
table {
  border-collapse: collapse;
  width: 100%;
  min-width: 1420px;
}

thead tr { background: var(--surface); border-bottom: 1px solid var(--border2); }
th {
  padding: 12px 16px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--muted);
  text-align: left;
  white-space: nowrap;
  font-weight: 600;
}
th.sticky-col {
  position: sticky;
  left: 0;
  background: var(--surface);
  border-right: 1px solid var(--border2);
  z-index: 2;
}

tbody tr { transition: filter .15s ease; }
tbody tr:hover { filter: brightness(1.12); }

td {
  padding: 16px;
  vertical-align: top;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  color: #c8c8d8;
  min-width: 160px;
}
td.sticky-col {
  position: sticky;
  left: 0;
  background: var(--bg);
  border-right: 1px solid var(--border2);
  z-index: 1;
  min-width: 148px;
  max-width: 148px;
}
tbody tr:last-child td { border-bottom: none; }

/* school accent strips */
.row-teal  td.sticky-col { border-left: 3px solid #2dd4bf; }
.row-violet td.sticky-col { border-left: 3px solid #a78bfa; }
.row-sky   td.sticky-col { border-left: 3px solid #38bdf8; }
.row-rose  td.sticky-col { border-left: 3px solid #fb7185; }

.row-teal  td { background: linear-gradient(90deg, rgba(45,212,191,.04) 0%, transparent 60%); }
.row-violet td { background: linear-gradient(90deg, rgba(167,139,250,.04) 0%, transparent 60%); }
.row-sky   td { background: linear-gradient(90deg, rgba(56,189,248,.04) 0%, transparent 60%); }
.row-rose  td { background: linear-gradient(90deg, rgba(251,113,133,.04) 0%, transparent 60%); }

.row-teal  td.sticky-col { background: rgba(45,212,191,.06); }
.row-violet td.sticky-col { background: rgba(167,139,250,.06); }
.row-sky   td.sticky-col { background: rgba(56,189,248,.06); }
.row-rose  td.sticky-col { background: rgba(251,113,133,.06); }

/* school name cell */
.school-name { font-weight: 600; color: #fff; font-size: 13px; line-height: 1.3; }
.school-note { color: var(--muted); font-size: 10px; margin-top: 2px; line-height: 1.4; }

/* cell internals */
.entry { margin-bottom: 10px; }
.entry:last-child { margin-bottom: 0; }
.entry-name { font-weight: 600; color: #e8e8f5; font-size: 12px; }
.entry-title { color: var(--muted); font-size: 10px; line-height: 1.4; margin-top: 1px; }
.entry-title.highlight { color: #fbbf24; font-weight: 500; }

.item { display: flex; flex-direction: column; gap: 2px; margin-bottom: 7px; }
.item:last-child { margin-bottom: 0; }
.item-row { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
.item-value { color: #c8c8d8; font-size: 11.5px; word-break: break-all; }
.item-note { color: var(--muted); font-style: italic; font-size: 10px; }

a.ext-link {
  color: var(--link);
  text-decoration: underline;
  text-underline-offset: 2px;
  font-size: 11.5px;
  word-break: break-all;
  transition: color .12s;
}
a.ext-link:hover { color: var(--link-hov); }

/* badges */
.badge {
  display: inline-block;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .06em;
  padding: 2px 5px;
  border-radius: 3px;
  white-space: nowrap;
  flex-shrink: 0;
}
.badge-confirmed { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-bd); }
.badge-inferred  { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-bd); }

/* footer */
.footer {
  margin-top: 16px;
  font-size: 10px;
  color: var(--dim);
  line-height: 1.7;
  font-family: 'IBM Plex Mono', monospace;
}

/* fade-in rows */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
tbody tr { animation: fadeUp .4s ease both; }
tbody tr:nth-child(1) { animation-delay: .05s; }
tbody tr:nth-child(2) { animation-delay: .12s; }
tbody tr:nth-child(3) { animation-delay: .19s; }
tbody tr:nth-child(4) { animation-delay: .26s; }

const Badge = ({ type }) => {
  const cls = type === 'confirmed' ? 'badge badge-confirmed' : 'badge badge-inferred';

  return h('span', { className: cls }, label);
};

const ExtLink = ({ href, label }) =>
  h('a', { className: 'ext-link', href, target: '_blank', rel: 'noreferrer' }, label);

const Item = ({ value, status, isLink, href, isNote }) => {
  if (isNote) return h('div', { className: 'item-note' }, value);
  return h('div', { className: 'item' },
    h('div', { className: 'item-row' },
      isLink
        ? h(ExtLink, { href, label: value })
        : h('span', { className: 'item-value' }, value),
      status && h(Badge, { type: status })
    )
  );
};
