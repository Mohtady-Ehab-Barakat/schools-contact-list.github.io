body {
  background: #f5f5f7;
  color: #1a1a2e;
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 13px;
  line-height: 1.6;
  min-height: 100vh;
  padding: 32px 20px 64px;
}

#root { max-width: 1600px; margin: 0 auto; }

.header { margin-bottom: 28px; }
.header-eyebrow {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: #666;
  margin-bottom: 4px;
}
.header-title { font-size: 24px; font-weight: 700; color: #111; }
.header-sub { color: #777; font-size: 12px; margin-top: 3px; }

.legend { display: flex; gap: 24px; margin-top: 12px; }
.legend-item { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #333; }
.dot { width: 8px; height: 8px; border-radius: 50%; }
.dot-green { background: #16a34a; }
.dot-amber { background: #d97706; }

.scroll-wrap {
  overflow-x: auto;
  border-radius: 10px;
  border: 1px solid #d1d5db;
  background: #fff;
  box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06);
}
.scroll-wrap::-webkit-scrollbar { height: 6px; background: #f0f0f0; }
.scroll-wrap::-webkit-scrollbar-thumb { background: #bbb; border-radius: 3px; }

table { border-collapse: collapse; width: 100%; min-width: 1440px; }

thead tr { background: #f8f9fb; border-bottom: 2px solid #e2e5ea; }
th {
  padding: 12px 14px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: #555;
  text-align: left;
  white-space: nowrap;
  font-weight: 700;
}
th.sticky-col {
  position: sticky; left: 0;
  background: #f8f9fb;
  border-right: 1px solid #e2e5ea;
  z-index: 2;
}

tbody tr { transition: background .1s; }
tbody tr:hover td { background: #f7f8fc !important; }
tbody tr:hover td.sticky-col { background: #f0f1f6 !important; }

td {
  padding: 14px;
  vertical-align: top;
  border-bottom: 1px solid #eaecf0;
  font-size: 12px;
  color: #1a1a2e;
  min-width: 168px;
  background: #fff;
}
td.sticky-col {
  position: sticky; left: 0;
  background: #fff;
  border-right: 1px solid #e2e5ea;
  z-index: 1;
  min-width: 152px;
  max-width: 152px;
}
tbody tr:last-child td { border-bottom: none; }

/* accent strips */
.row-teal  td.sticky-col { border-left: 4px solid #14b8a6; background: #f0fdfa; }
.row-violet td.sticky-col { border-left: 4px solid #8b5cf6; background: #f5f3ff; }
.row-sky   td.sticky-col { border-left: 4px solid #0ea5e9; background: #f0f9ff; }
.row-rose  td.sticky-col { border-left: 4px solid #f43f5e; background: #fff1f2; }

/* subtle row tint */
.row-teal  td { background: #fafffe; }
.row-violet td { background: #fbfaff; }
.row-sky   td { background: #fafcff; }
.row-rose  td { background: #fffafb; }

.school-name { font-weight: 700; color: #111; font-size: 13px; line-height: 1.3; }
.school-note { color: #666; font-size: 10px; margin-top: 3px; line-height: 1.4; }

.entry { margin-bottom: 10px; }
.entry:last-child { margin-bottom: 0; }
.entry-name { font-weight: 600; color: #111; font-size: 12px; }
.entry-title { color: #555; font-size: 11px; line-height: 1.4; margin-top: 1px; }
.entry-title.star { color: #b45309; font-weight: 600; }

.item { margin-bottom: 7px; }
.item:last-child { margin-bottom: 0; }
.item-row { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
.item-value { color: #1a1a2e; font-size: 12px; word-break: break-all; }
.item-note { color: #666; font-style: italic; font-size: 11px; line-height: 1.5; margin-bottom: 5px; }
.item-note:last-child { margin-bottom: 0; }

a.ext-link {
  color: #2563eb;
  text-decoration: underline;
  text-underline-offset: 2px;
  font-size: 12px;
  word-break: break-all;
  transition: color .1s;
}
a.ext-link:hover { color: #1d4ed8; }

.badge {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .04em;
  padding: 2px 6px;
  border-radius: 3px;
  white-space: nowrap;
  display: inline-block;
}
.badge-confirmed {
  background: #dcfce7;
  color: #15803d;
  border: 1px solid #86efac;
}
.badge-inferred {
  background: #fef3c7;
  color: #92400e;
  border: 1px solid #fcd34d;
}

.footer {
  margin-top: 14px;
  font-size: 10px;
  color: #999;
  line-height: 1.8;
  font-family: 'IBM Plex Mono', monospace;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
tbody tr { animation: fadeUp .3s ease both; }
tbody tr:nth-child(1) { animation-delay: .04s; }
tbody tr:nth-child(2) { animation-delay: .1s; }
tbody tr:nth-child(3) { animation-delay: .16s; }
tbody tr:nth-child(4) { animation-delay: .22s; }

  h('span', { className: `badge badge-${type}` },

const ExtLink = ({ href, label }) =>
  h('a', { className: 'ext-link', href, target: '_blank', rel: 'noreferrer' }, label);

const Item = ({ value, status, isLink, href, isNote }) => {
  if (isNote) return h('div', { className: 'item-note' }, value);
  return h('div', { className: 'item' },
    h('div', { className: 'item-row' },
      isLink
        ? h(ExtLink, { href, label: value })
        : h('span', { className: 'item-value' }, value),
      status && h(Badge, { type: status })
    )
  );
